workflows:
  mobondo-android-debug:
    name: MOBONDO - APK Android (debug)
    max_build_duration: 120
    # Free individual Codemagic plans include macOS M2 minutes.
    # Linux X2 requires billing to be enabled.
    instance_type: mac_mini_m2

    environment:
      vars:
        GODOT_VERSION: "4.2.2"
        APK_PATH: "build/MOBONDO-debug.apk"

    scripts:
      - name: Install Godot 4.2.2 and Android export templates
        script: |
          set -euo pipefail

          TOOLS_DIR="$CM_BUILD_DIR/.godot-tools"
          TEMPLATE_ROOT="$HOME/Library/Application Support/Godot/export_templates"
          TEMPLATE_DIR="$TEMPLATE_ROOT/${GODOT_VERSION}.stable"
          mkdir -p "$TOOLS_DIR" "$TEMPLATE_DIR"
          cd "$TOOLS_DIR"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o godot.zip
          unzip -oq godot.zip -d godot
          GODOT_BIN="$TOOLS_DIR/godot/Godot.app/Contents/MacOS/Godot"
          if [ ! -x "$GODOT_BIN" ]; then
            GODOT_BIN="$(find "$TOOLS_DIR/godot" -type f -name Godot -perm -111 | head -n 1)"
          fi
          test -x "$GODOT_BIN"
          "$GODOT_BIN" --version

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o export_templates.tpz
          mkdir -p "$TOOLS_DIR/templates"
          unzip -oq export_templates.tpz -d "$TOOLS_DIR/templates"
          find "$TOOLS_DIR/templates" -type f \( -name "android_debug.apk" -o -name "android_release.apk" -o -name "android_source.zip" \) -exec cp {} "$TEMPLATE_DIR/" \;
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

          echo "GODOT_BIN=$GODOT_BIN" >> "$CM_ENV"
          echo "GODOT_BIN=$GODOT_BIN"

      - name: Configure Android SDK and Java for Godot
        script: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          JAVA_HOME="${JAVA_HOME:-/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home}"
          test -d "$ANDROID_SDK"
          test -x "$JAVA_HOME/bin/java"
          SDKMANAGER="$(find "$ANDROID_SDK" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager introuvable dans le Android SDK: $ANDROID_SDK"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" "platform-tools" "platforms;android-33" "build-tools;28.0.0" "build-tools;30.0.3" "build-tools;33.0.2" "build-tools;34.0.0"
          ADB="$ANDROID_SDK/platform-tools/adb"
          if [ -x "$ADB" ]; then
            "$ADB" start-server
            "$ADB" devices
          else
            echo "ERROR: adb introuvable dans $ANDROID_SDK/platform-tools"
            exit 1
          fi
          mkdir -p "$HOME/Library/Application Support/Godot"
          cat > "$HOME/Library/Application Support/Godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$CM_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$CM_ENV"

      - name: Verify MOBONDO project files
        script: |
          set -euo pipefail
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f scripts/player.gd
          "$GODOT_BIN" --version
          echo "Project files found. Godot validation will run during Android export."

      - name: Create temporary Android debug signing key
        script: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$CM_BUILD_DIR/mobondo-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Export MOBONDO APK
        script: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$CM_BUILD_DIR/mobondo-debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p "$CM_BUILD_DIR/build"
          "$GODOT_BIN" --headless --verbose --path "$CM_BUILD_DIR" --export-debug "Android" "$CM_BUILD_DIR/$APK_PATH"
          test -s "$CM_BUILD_DIR/$APK_PATH"
          ls -lh "$CM_BUILD_DIR/$APK_PATH"

    artifacts:
      - build/*.apk
      - .godot/imported/**/*.log
